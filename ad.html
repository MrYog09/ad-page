<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src='//libtl.com/sdk.js' data-zone='11417452' data-sdk='show_11417452'></script>

    <style>
        * { 
            box-sizing: border-box; 
        }
        
        /* Moving Gradient Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #112240, #0a192f);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Premium Card */
        .container {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 25px 35px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.1) inset;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Glowing Icon Effect */
        .icon-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(37, 99, 235, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        .icon { 
            font-size: 40px; 
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        h2 { 
            color: #e0f2fe; 
            margin: 10px 0; 
            font-size: 26px; 
            font-weight: 800; 
            letter-spacing: 0.5px; 
        }
        
        p { 
            font-size: 15px; 
            color: #94a3b8; 
            margin-bottom: 25px; 
            line-height: 1.6; 
        }

        .highlight { 
            color: #38bdf8; 
            font-weight: bold; 
        }

        /* Bouncing Arrow */
        .arrow-down {
            font-size: 28px;
            margin-bottom: 12px;
            display: block;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Super Premium Button */
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        .btn:active { 
            transform: scale(0.96); 
        }

        .btn:disabled {
            background: #475569;
            animation: none;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-wrapper">
            <div class="icon">🛡️</div>
        </div>
        <h2>Security Check</h2>
        <p>Please complete this quick verification to prove you are human and unlock the <span class="highlight">Stream Link</span>.</p>
        
        <div class="arrow-down">👇</div>

        <button id="verifyBtn" class="btn">Click Here to Verify</button>
    </div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        let btn = document.getElementById("verifyBtn");
        let arrow = document.querySelector(".arrow-down");

        // Handle button click event
        btn.addEventListener("click", function() {
            btn.innerText = "⏳ Loading Ad...";
            btn.disabled = true; 
            
            // Hide the bouncing arrow while loading
            arrow.style.display = "none"; 
            
            // Trigger Monetag Ad
            if (typeof show_11417452 === 'function') {
                show_11417452().then(() => {
                    // Ad shown successfully
                    btn.innerText = "✅ Verified! Closing...";
                    btn.style.background = "#10b981"; 
                    
                    // Close the Mini App after a short delay
                    setTimeout(() => { 
                        tg.close(); 
                    }, 1200);
                }).catch((err) => {
                    // Handle ad load failure or cancellation
                    alert("Verification canceled or failed. Please try again.");
                    btn.innerText = "Click Here to Verify";
                    btn.disabled = false;
                    arrow.style.display = "block";
                });
            } else {
                // Handle case where script is not fully loaded
                alert("Security script is loading... Please wait 2 seconds and click again.");
                btn.innerText = "Click Here to Verify";
                btn.disabled = false;
                arrow.style.display = "block";
            }
        });
    </script>
</body>
</html>
