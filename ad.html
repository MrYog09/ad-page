<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11417452' data-sdk='show_11417452'></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #112240, #0a192f);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff; text-align: center; margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container {
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px);
            padding: 40px 25px 35px; border-radius: 24px; max-width: 400px; width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
        }
        .icon-wrapper {
            width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(37,99,235,0.2));
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h2 { color: #e0f2fe; margin: 10px 0; font-size: 26px; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; line-height: 1.6; }
        .highlight { color: #38bdf8; font-weight: bold; }
        .arrow-down { font-size: 28px; margin-bottom: 12px; display: block; animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; border: none;
            padding: 18px 20px; font-size: 18px; border-radius: 14px; cursor: pointer;
            width: 100%; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(37,99,235,0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37,99,235,0.7); } 70% { box-shadow: 0 0 0 15px rgba(37,99,235,0); } }
        .btn:disabled { background: #475569; animation: none; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">🛡️</div>
        <h2>Security Check</h2>
        <p>Complete this quick verification. <br>The <span class="highlight">Stream Link</span> will be sent to you in the Bot.</p>
        <div class="arrow-down">👇</div>
        <button id="verifyBtn" class="btn">Verify to Get Link</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Extract parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');
        const videoUrl = urlParams.get('video');
        const workerUrl = urlParams.get('worker');

        let btn = document.getElementById("verifyBtn");
        let arrow = document.querySelector(".arrow-down");

        btn.addEventListener("click", function() {
            btn.innerText = "⏳ Loading Ad...";
            btn.disabled = true; 
            arrow.style.display = "none";
            
            if (typeof show_11417452 === 'function') {
                show_11417452().then(() => {
                    btn.innerText = "✅ Sending Link to Bot...";
                    btn.style.background = "#10b981"; 
                    
                    // Tell Cloudflare worker that ad is completed
                    fetch(workerUrl + '/verifySuccess', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, stream_url: videoUrl })
                    }).then(() => {
                        // Close Web App and return to Bot
                        setTimeout(() => { tg.close(); }, 800);
                    }).catch(() => {
                        // Fallback if network issue
                        setTimeout(() => { tg.close(); }, 800);
                    });

                }).catch((err) => {
                    alert("Verification canceled. Please try again.");
                    btn.innerText = "Verify to Get Link";
                    btn.disabled = false;
                    arrow.style.display = "block";
                });
            } else {
                alert("Security script loading... Click again in 2 seconds.");
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
